<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HealthBot — Skrining awal gejala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14332B;
  --ink-soft:#557267;
  --wash:#E9F4EE;
  --paper:#FFFFFF;
  --line:#D6E7DD;
  --leaf:#12A67C;
  --leaf-deep:#0B7D5D;
  --sunny:#FFC24B;
  --amber:#F0A028;
  --coral:#EF6152;
  --shadow:0 1px 2px rgba(20,51,43,.05), 0 8px 24px -12px rgba(20,51,43,.22);
  --r:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  color:var(--ink);
  background:var(--wash);
  background-image:
    radial-gradient(120% 70% at 50% -10%, #FFF6E2 0%, rgba(255,246,226,0) 60%),
    radial-gradient(90% 50% at 100% 0%, #DCEFF5 0%, rgba(220,239,245,0) 55%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.app{
  max-width:720px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column;
}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:12px;
  padding:14px 18px;
  background:rgba(233,244,238,.82);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.face{
  width:44px;height:44px;flex:none;border-radius:15px;
  background:linear-gradient(160deg,var(--leaf),var(--leaf-deep));
  position:relative; box-shadow:0 6px 14px -6px rgba(11,125,93,.7);
}
.face::before,.face::after{
  content:""; position:absolute; top:16px; width:5px; height:9px;
  border-radius:3px; background:#fff;
  animation:blink 6.5s infinite;
}
.face::before{left:12px} .face::after{right:12px}
.face i{
  position:absolute; left:15px; bottom:11px;
  width:14px;height:7px;border-radius:0 0 9px 9px;
  border-bottom:2.5px solid #fff; border-left:2.5px solid transparent; border-right:2.5px solid transparent;
}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-weight:800; font-size:20px; letter-spacing:-.02em; margin:0; line-height:1.1;
}
.sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:inline-block;margin-right:5px}

/* ---------- stream ---------- */
.stream{flex:1;padding:22px 18px 8px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;max-width:100%}
.row.me{justify-content:flex-end}
.pip{
  width:28px;height:28px;border-radius:10px;flex:none;margin-top:2px;
  background:linear-gradient(160deg,var(--leaf),var(--leaf-deep));
}
.bubble{
  background:var(--paper); padding:14px 16px; border-radius:var(--r);
  border-top-left-radius:6px; box-shadow:var(--shadow);
  font-size:15px; line-height:1.6; max-width:80%;
  animation:rise .32s cubic-bezier(.2,.8,.3,1);
}
.row.me .bubble{
  background:var(--leaf-deep); color:#fff;
  border-top-left-radius:var(--r); border-top-right-radius:6px;
}
.bubble p{margin:0 0 8px} .bubble p:last-child{margin:0}
.bubble strong{font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- triage card ---------- */
.triage{margin-top:12px;border-top:1px dashed var(--line);padding-top:14px}
.level{
  display:inline-flex;align-items:center;gap:7px;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;
  padding:5px 12px 5px 9px;border-radius:999px;color:#fff;
}
.level .glyph{width:16px;height:16px}
.meter{margin:14px 0 10px;position:relative}
.track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--leaf) 0%,var(--sunny) 50%,var(--coral) 100%);opacity:.28}
.knob{
  position:absolute;top:-4px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:4px solid var(--leaf);
  transform:translateX(-50%);
  transition:left .7s cubic-bezier(.34,1.4,.5,1), border-color .7s;
}
.stops{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:9px;font-weight:600}
.stops span{flex:1}
.stops span:nth-child(2){text-align:center}
.stops span:last-child{text-align:right}
.advice{list-style:none;padding:0;margin:12px 0 0;font-size:14px}
.advice li{display:flex;gap:9px;padding:5px 0;line-height:1.5}
.advice li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--leaf);margin-top:8px;flex:none}
.redflag{
  margin-top:12px;background:#FFF2EF;border-left:3px solid var(--coral);
  padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;line-height:1.55;
}

/* ---------- typing ---------- */
.typing{display:flex;gap:5px;padding:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);opacity:.4;animation:bob 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:.9}}

/* ---------- composer ---------- */
.dock{
  position:sticky;bottom:0;padding:10px 18px 16px;
  background:linear-gradient(180deg,rgba(233,244,238,0),rgba(233,244,238,.95) 28%);
}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font:inherit;font-size:13px;font-weight:500;
  background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);
  padding:8px 14px;border-radius:99px;cursor:pointer;transition:.18s;
}
.chip:hover{border-color:var(--leaf);color:var(--leaf-deep);transform:translateY(-1px)}
.composer{
  display:flex;align-items:flex-end;gap:8px;background:var(--paper);
  border:1px solid var(--line);border-radius:22px;padding:8px 8px 8px 18px;
  box-shadow:var(--shadow);transition:border-color .2s;
}
.composer:focus-within{border-color:var(--leaf)}
textarea{
  flex:1;border:0;resize:none;font:inherit;font-size:15px;color:var(--ink);
  background:none;outline:none;max-height:120px;padding:9px 0;line-height:1.5;
}
textarea::placeholder{color:#9BB3A9}
.send{
  width:40px;height:40px;flex:none;border:0;border-radius:14px;cursor:pointer;
  background:var(--leaf-deep);color:#fff;display:grid;place-items:center;transition:.18s;
}
.send:hover{background:var(--leaf);transform:translateY(-1px)}
.send:disabled{background:#C3D6CD;cursor:not-allowed;transform:none}
.disclaimer{text-align:center;font-size:11.5px;color:var(--ink-soft);margin:11px 4px 0;line-height:1.5}
.disclaimer b{color:var(--coral)}
:focus-visible{outline:2.5px solid var(--leaf-deep);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="face" aria-hidden="true"><i></i></div>
    <div>
      <h1>HealthBot</h1>
      <div class="sub"><span class="dot-live"></span>Skrining awal · bukan diagnosis</div>
    </div>
  </header>

  <main class="stream" id="stream" aria-live="polite"></main>

  <div class="dock">
    <div class="chips" id="chips"></div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ceritakan gejalanya: sejak kapan, seberapa berat…"></textarea>
      <button class="send" id="send" aria-label="Kirim">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <p class="disclaimer">Bukan alat diagnosis. Kalau darurat, telepon <b>119</b>.</p>
  </div>

</div>

<script>
const stream = document.getElementById('stream');
const input  = document.getElementById('input');
const send   = document.getElementById('send');

const LEVELS = {
  mandiri: {label:'Bisa rawat mandiri', color:'var(--leaf)',  pos:8},
  klinik : {label:'Sebaiknya ke klinik', color:'var(--amber)', pos:50},
  igd    : {label:'Segera ke IGD',       color:'var(--coral)', pos:92}
};

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function scroll(){ stream.scrollIntoView(false); window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }

function addUser(text){
  stream.append(el(`<div class="row me"><div class="bubble">${escape(text)}</div></div>`));
  scroll();
}

function addBot(html){
  const row = el(`<div class="row"><div class="pip"></div><div class="bubble">${html}</div></div>`);
  stream.append(row); scroll();
  const knob = row.querySelector('.knob');
  if(knob) requestAnimationFrame(()=>{ knob.style.left = knob.dataset.pos + '%'; });
}

function typing(on){
  let t = document.getElementById('typing');
  if(on && !t){
    stream.append(el(`<div class="row" id="typing"><div class="pip"></div><div class="bubble typing"><i></i><i></i><i></i></div></div>`));
    scroll();
  }
  if(!on && t) t.remove();
}

function escape(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ---- triage card markup ---- */
function triageCard(level, intro, advice, redflag){
  const L = LEVELS[level];
  return `
    <p>${intro}</p>
    <div class="triage">
      <span class="level" style="background:${L.color}">
        <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 12h4l2-5 3 10 2-5h5"/></svg>
        ${L.label}
      </span>
      <div class="meter">
        <div class="track"></div>
        <div class="knob" data-pos="${L.pos}" style="left:8%;border-color:${L.color}"></div>
        <div class="stops"><span>Rawat mandiri</span><span>Klinik</span><span>IGD</span></div>
      </div>
      <ul class="advice">${advice.map(a=>`<li>${a}</li>`).join('')}</ul>
      ${redflag ? `<div class="redflag"><strong>Segera ke IGD kalau:</strong> ${redflag}</div>` : ''}
    </div>`;
}

/* =====================================================================
   MOCK BRAIN — ganti seluruh fungsi reply() ini dengan fetch ke API kamu.
   Contoh: const r = await fetch('/api/chat',{method:'POST',body:...})
   ===================================================================== */
function reply(text){
  const q = text.toLowerCase();

  // 1. Pertanyaan identitas — dijawab, tetap dalam karakter
  if(/(siapa|nama)\s*(kamu|kau|lu|anda|mu)?|kamu (itu )?apa|kenalan/.test(q)){
    return `<p>Aku <strong>HealthBot</strong>. Tugasku satu: dengar keluhanmu, lalu memperkirakan seberapa mendesak dan ke mana sebaiknya kamu pergi — rawat mandiri, klinik, atau IGD.</p>
            <p>Aku bukan dokter dan tidak mendiagnosis. Coba ceritakan gejalanya?</p>`;
  }

  // 2. Matematika — dihitung
  const m = text.match(/^[\s\d+\-*/().,^%]+$/);
  if(m && /\d/.test(text) && /[+\-*/^]/.test(text)){
    try{
      const expr = text.replace(/,/g,'.').replace(/\^/g,'**');
      const val = Function('"use strict";return ('+expr+')')();
      if(Number.isFinite(val))
        return `<p><strong>${escape(text.trim())} = ${Math.round(val*1e6)/1e6}</strong></p>
                <p>Ngomong-ngomong, aku dibuat untuk keluhan kesehatan. Ada yang mau diceritakan?</p>`;
    }catch(e){}
  }

  // 3. Minta ramalan / prediksi
  if(/prediksi|ramal|masa depan|besok kena|bakal sakit|umur berapa|sembuh kapan/.test(q)){
    return `<p>Aku nggak bisa meramal. Menebak-nebak soal kesehatan justru bagian yang paling berbahaya — itu persis kesalahan yang bikin orang menunda ke dokter.</p>
            <p>Yang bisa aku lakukan: menilai gejala yang <em>sedang</em> kamu rasakan sekarang dan bilang seberapa mendesak. Mau coba?</p>`;
  }

  // 4. Gejala darurat
  if(/nyeri dada|sesak berat|pingsan|kejang|tidak sadar|stroke|lumpuh|muntah darah|bab hitam/.test(q)){
    return triageCard('igd',
      'Yang kamu sebut termasuk tanda bahaya. Jangan tunggu membaik sendiri.',
      ['Hubungi <strong>119</strong> atau langsung ke IGD terdekat sekarang.',
       'Jangan menyetir sendiri — minta diantar.',
       'Kalau bisa, catat sejak jam berapa keluhan mulai. Itu ditanya di IGD.']);
  }

  // 5. Gejala sedang
  if(/demam|panas|batuk|pilek|diare|mencret|muntah|sakit kepala|pusing|nyeri|sakit perut|gatal|ruam/.test(q)){
    const anak = /anak|balita|bayi|adik/.test(q);
    return triageCard('klinik',
      anak ? 'Untuk anak, ambang batasnya lebih rendah daripada orang dewasa. Ini penilaian awalnya:'
           : 'Terima kasih ceritanya. Ini penilaian awalku:',
      ['Pantau 24–48 jam. Catat suhu tiap 4 jam dan berapa kali gejalanya muncul.',
       'Cukupi cairan — oralit lebih baik daripada air putih saja kalau ada diare atau muntah.',
       'Kalau belum membaik setelah 2 hari, atau makin berat, ke klinik atau puskesmas.'],
      anak ? 'anak lemas dan sulit dibangunkan, tidak mau minum sama sekali, kencing berkurang drastis, atau napas terlihat cepat dan berat.'
           : 'muncul sesak napas, nyeri dada, bingung/linglung, atau demam di atas 39°C yang tidak turun dengan obat.');
  }

  // 6. Di luar topik
  return `<p>Itu di luar jangkauanku. Aku sengaja dibatasi ke satu hal: menilai gejala kesehatan dan menentukan tingkat urgensinya.</p>
          <p>Kalau kamu atau orang di sekitarmu sedang ada keluhan, ceritakan — sejak kapan, seberapa berat, dan ada gejala lain apa.</p>`;
}

/* ---- flow ---- */
async function submit(text){
  if(!text.trim()) return;
  addUser(text);
  input.value=''; input.style.height='auto'; send.disabled=true;
  typing(true);
  await new Promise(r=>setTimeout(r, 700 + Math.random()*500));
  typing(false);
  addBot(reply(text));
  send.disabled=false; input.focus();
}

send.onclick = ()=>submit(input.value);
input.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submit(input.value); }
});
input.addEventListener('input', ()=>{
  input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,120)+'px';
});

/* ---- chips ---- */
const SUGGESTIONS = [
  'Demam 3 hari, batuk kering, badan pegal',
  'Sakit kepala sebelah sejak kemarin, mual',
  'Anak 5 tahun diare 4 kali sejak pagi',
  'Kamu siapa?'
];
const chips = document.getElementById('chips');
SUGGESTIONS.forEach(s=>{
  const b = el(`<button class="chip">${s}</button>`);
  b.onclick = ()=>submit(s);
  chips.append(b);
});

/* ---- sapaan awal ---- */
addBot(`<p>Halo. Aku <strong>HealthBot</strong> — aku bantu memperkirakan seberapa mendesak keluhanmu dan ke mana sebaiknya kamu pergi.</p>
        <p>Ceritakan sedetail mungkin: sejak kapan, seberapa berat, dan ada keluhan lain apa. Makin lengkap, makin tepat penilaiannya.</p>`);
</script>
</body>
</html>
